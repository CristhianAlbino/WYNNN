<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="/w/1.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/w/1.png">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Estilos específicos para a página da IA */
        .ai-page-main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background-color: var(--section-background-alt);
        }

        .chatbot-container {
            background-color: var(--card-background);
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-color);
            padding: 1rem;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 70vh;
            /* Altura responsiva */
            min-height: 500px;
        }

        .chatbot-header {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 0.8rem 1rem;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .chatbot-header h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .chat-display {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 15px;
            word-wrap: break-word;
            text-align: left;
        }

        .user-message {
            background-color: var(--primary-color);
            color: var(--text-light);
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .bot-message {
            background-color: var(--section-background-alt);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 1rem;
        }

        .chat-input {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        .send-button {
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
        }

        .loading-indicator {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
            height: 10px;
        }

        .loading-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            margin: 0 3px;
            animation: typing-bounce 0.8s infinite ease-in-out;
            opacity: 0;
        }

        .loading-indicator.hidden span {
            animation: none;
            opacity: 0;
        }

        .loading-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .loading-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-bounce {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        .hidden {
            display: none;
        }

        .faq-buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
            padding: 0 1rem;
        }

        .faq-button {
            background-color: var(--section-background-alt);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Responsividade para a página da IA */
        @media (max-width: 768px) {
            .chatbot-container {
                height: 85vh;
                /* Aumenta a altura em telas menores */
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="/indexx.html">WYN</a>
                </div>
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="menu-icon">
                    <div class="menu">
                        <i class='bx bx-menu'></i>
                    </div>
                </label>
                <nav class="site-nav">
                    <ul>
                        <li><a href="/indexx.html" style="--navAni:1">Inicio</a></li>
                        <li><a href="/indexx.html#how-it-works-section" style="--navAni:2">Como Funciona</a></li>
                        <li><a href="/indexx.html#our-team-section" style="--navAni:4">Sobre Nós</a></li>
                        <li><a href="/indexx.html#contact-us-section" style="--navAni:5">Contate-nos</a></li>
                        <li><a href="/Seleção/dist/index.html" style="--navAni:6">Login/Cadastro</a></li>
                        <li><a href="/ia.html" class="active" style="--navAni:7">IA Wynteligence</a></li>
                        <li><a href="/LANDING PAGE WYN/LANDING PAGE WYN/login-admin.html" class="admin-link-header"
                                style="--navAni:8">Admin</a></li>
                        <li><i class='bx bx-moon theme-switcher' id="theme-switcher-icon"></i></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="ai-page-main">
        <div class="chatbot-container">
            <div class="chatbot-header">
                <h3>Assistente para Operadores</h3>
            </div>
            <div class="chat-display" id="chat-messages">
                <!-- Mensagens da IA e do usuário serão inseridas aqui -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Digite sua mensagem..." class="chat-input">
                <button id="send-button" class="send-button">
                    <i class='bx bx-send'></i>
                </button>
            </div>
            <div id="loading-indicator" class="loading-indicator hidden">
                <span></span><span></span><span></span>
            </div>
        </div>
    </main>

    <!-- O footer foi removido para manter o foco na IA -->

    <!-- Script de IA do chatbot flutuante, ajustado para esta página -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // --- Configuração da URL do Backend ---
            const BACKEND_URL = 'https://wyn-backend.onrender.com';

            if (!BACKEND_URL) {
                console.error("ERRO: A URL do backend não foi configurada.");
            }

            // --- Lógica de Alternância de Tema ---
            const themeSwitcher = document.getElementById('theme-switcher-icon');
            const body = document.body;
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme && currentTheme !== 'light-mode') {
                body.classList.add(currentTheme);
                if (currentTheme === 'dark-mode') {
                    themeSwitcher.classList.replace('bx-moon', 'bx-sun');
                }
            } else {
                body.classList.remove('dark-mode');
                themeSwitcher.classList.replace('bx-sun', 'bx-moon');
            }

            if (themeSwitcher) {
                themeSwitcher.addEventListener('click', () => {
                    body.classList.toggle('dark-mode');
                    if (body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark-mode');
                        themeSwitcher.classList.replace('bx-moon', 'bx-sun');
                    } else {
                        localStorage.setItem('theme', 'light-mode');
                        themeSwitcher.classList.replace('bx-sun', 'bx-moon');
                    }
                });
            }

            // --- Lógica do Chatbot de IA ---
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const loadingIndicator = document.getElementById('loading-indicator');

            const now = new Date();
            const hour = now.getHours();
            let greeting;
            if (hour >= 5 && hour < 12) {
                greeting = "Bom dia!";
            } else if (hour >= 12 && hour < 18) {
                greeting = "Boa tarde!";
            } else {
                greeting = "Boa noite!";
            }

            const initialBotMessage = `${greeting} Olá! Sou o Assistente para Operadores. Como posso te auxiliar hoje?`;

            let chatHistory = [
                {
                    role: "user",
                    parts: [{
                        text: `Você é um assistente de IA para operadores de telemarketing bancário, com foco principal no Banco Santander. Seu nome é Assistente para Operadores. Sua função é ser um assistente interno para o operador, ajudando com informações sobre produtos, serviços e processos do Banco Santander
                        NUNCA EM NENHUMA HIPOTESE, USE NEGRITO, ITALICO OU QUALQUER OUTRO TIPO DE FORMATAÇÃO, APENAS TEXTO SIMPLES.`
                    }]
                },
                {
                    role: "model",
                    parts: [{
                        text: initialBotMessage
                    }]
                }
            ];

            // Adiciona a mensagem inicial do bot ao carregar a página
            addMessage('bot', initialBotMessage);

            // Sugestões de Perguntas Frequentes (FAQs)
            const faqs = [
                { question: "Qual o script para portabilidade de salário?" },
                { question: "Como preencher uma formalização de empréstimo?" },
                { question: "Quais são as taxas de um cartão de crédito X?" }
            ];

            function renderFaqButtons() {
                const faqButtonsContainer = document.createElement('div');
                faqButtonsContainer.classList.add('faq-buttons-container');

                faqs.forEach(faq => {
                    const button = document.createElement('button');
                    button.classList.add('faq-button');
                    button.textContent = faq.question;
                    button.addEventListener('click', () => {
                        userInput.value = faq.question;
                        sendMessageToAI();
                    });
                    faqButtonsContainer.appendChild(button);
                });
                chatMessages.appendChild(faqButtonsContainer);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            renderFaqButtons();

            function addMessage(sender, text) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message', `${sender}-message`);
                const paragraphElement = document.createElement('p');
                paragraphElement.textContent = text;
                messageElement.appendChild(paragraphElement);
                chatMessages.appendChild(messageElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            async function sendMessageToAI() {
                const message = userInput.value.trim();
                if (message === '') return;

                addMessage('user', message);
                chatHistory.push({
                    role: "user",
                    parts: [{
                        text: message
                    }]
                });
                userInput.value = '';

                loadingIndicator.classList.remove('hidden');
                sendButton.disabled = true;

                try {
                    const response = await fetch(`${BACKEND_URL}/api/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            chatHistory: chatHistory
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.aiResponse) {
                        addMessage('bot', result.aiResponse);
                        chatHistory.push({
                            role: "model",
                            parts: [{
                                text: result.aiResponse
                            }]
                        });
                    } else {
                        addMessage('bot', result.message || 'Desculpe, não consegui gerar uma resposta. Tente novamente.');
                        console.error('Erro na resposta do backend:', result);
                    }
                } catch (error) {
                    console.error('Erro ao chamar o backend:', error);
                    addMessage('bot', 'Ocorreu um erro ao conectar com a IA. Por favor, tente novamente mais tarde.');
                } finally {
                    loadingIndicator.classList.add('hidden');
                    sendButton.disabled = false;
                }
            }

            if (sendButton) {
                sendButton.addEventListener('click', sendMessageToAI);
            }

            if (userInput) {
                userInput.addEventListener('keypress', (event) => {
                    if (event.key === 'Enter') {
                        sendMessageToAI();
                    }
                });
            }
        });
    </script>
</body>

</html>
